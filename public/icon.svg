<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Importing rounded font for the P -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700&amp;display=swap');
      
      @font-face {
        font-family: 'Geist';
        src: url('assets/fonts/Geist-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
      }

      .icon-letter {
        font-family: 'Geist', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 260px;
        fill: #FFFFFF;
        text-shadow: 0 4px 12px rgba(43, 42, 53, 0.08);
      }
    </style>

    <!-- Master background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D4FF"/> <!-- Lavender -->
      <stop offset="40%" stop-color="#F9D5E5"/> <!-- Blush Pink -->
      <stop offset="100%" stop-color="#FFD8C2"/> <!-- Peach -->
    </linearGradient>

    <!-- Highlight stroke gradient -->
    <linearGradient id="hlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CDEAC0" stop-opacity="0.9"/> <!-- Mint -->
      <stop offset="100%" stop-color="#D6EFFF" stop-opacity="0.85"/> <!-- Sky Blue -->
    </linearGradient>
    
    <!-- Drop shadow for the squircle itself to feel premium -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2B2A35" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Translucent highlight swipe across the middle background -->
  <path d="M 120,320 C 190,300 280,310 380,270" 
        fill="none" 
        stroke="url(#hlGrad)" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Subtle creative yellow accent streak underneath -->
  <path d="M 140,340 C 200,325 270,330 350,300" 
        fill="none" 
        stroke="#FFF3B0" 
        stroke-width="12" 
        stroke-linecap="round" 
        opacity="0.9" />

  <!-- Stylized Icon Letter "P" -->
  <text x="180" y="340" class="icon-letter">P</text>

  <!-- Sleek minimalistic drawing pen tip hovering near the highlight -->
  <g transform="translate(380, 270) rotate(-40)">
    <path d="M 0,0 L -12,-20 L 12,-20 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M 0,-20 L 0,-36" stroke="#FFFFFF" stroke-width="2.5" opacity="0.95" />
    <circle cx="0" cy="-6" r="1.8" fill="#F9D5E5" />
  </g>
</svg>
